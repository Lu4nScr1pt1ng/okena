# okena's configuration in the container image, when none is mounted: a page
# on :8080 that says it runs, and metrics and health on :9090. Mount yours over
# it:  docker run -v ./okena.conf:/etc/okena/okena.conf:ro ...
okena {
    metrics :9090
}

http :8080 {
    route /* {
        respond 200 "okena is running. Mount your configuration at /etc/okena/okena.conf (examples: https://github.com/Lu4nScr1pt1ng/okena/tree/main/examples).\n"
    }
}
