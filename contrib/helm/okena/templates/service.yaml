apiVersion: v1
kind: Service
metadata:
  name: {{ include "okena.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "okena.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if ne .Values.service.type "ClusterIP" }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  selector: {{- include "okena.selector" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.http }}, targetPort: http}
    - {name: https, port: {{ .Values.service.https }}, targetPort: https}
