apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "okena.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "okena.labels" . | nindent 4 }}
data:
  okena.conf: |
    okena {
        metrics :{{ .Values.ports.metrics }}
        admin unix:/run/okena/admin.sock
        drain delay=5s timeout=30s
        gateway kubernetes dir=/var/lib/okena/gateway class={{ .Values.gatewayClass.name }} ingress={{ .Values.ingressClass.name }} http={{ .Values.ports.http }} https={{ .Values.ports.https }}{{ if .Values.ingressClass.default }} ingress_default=on{{ end }}{{ if .Values.statusAddress }} address={{ .Values.statusAddress }}{{ else }} publish_service={{ .Release.Namespace }}/{{ include "okena.name" . }}{{ end }}
    {{- .Values.okena | nindent 8 }}
    }
    include "/var/lib/okena/gateway/*.conf"
    {{- with .Values.extraConfig }}
    {{- . | nindent 4 }}
    {{- end }}
