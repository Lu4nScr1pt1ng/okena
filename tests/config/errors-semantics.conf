tcp :5432 { to pool pgg }
tcp 10.0.0.1:5432 { to 10.0.0.1:1 10.0.0.2:1 10.0.0.1:1 }
tcp [::]:6000 { }
tcp :6001 { to 1.1.1.1:1; timeout { idle 5s; header 1s } }
pool pg {
    server 10.0.0.11:5432
    server 10.0.0.11:5432
}
pool empty {
    balance random
}
pool pg { server 1.1.1.1:1 }
pool lonely { server 1.1.1.1:1 }
pool hc1 { server 1.1.1.1:2; health tcp /x }
pool hc2 { server 1.1.1.1:3; health http }
pool hc3 { server 1.1.1.1:4; health http POST /x }
http :8090 {
    route /a { to 1.1.1.1:1; redirect 301 /b }
    route /c { redirect 301 nowhere }
    route /d {
        header set host evil
        header set x-a
        header drop x-b value
        header set X-Upper v
        header set x-* v
        response header move x-c
        to 1.1.1.1:1
    }
}
