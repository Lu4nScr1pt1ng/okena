# route actions: redirect, rewrite, header changes
http :8090 {
    route /a { to 1.1.1.1:1; redirect 301 /b }
    route /c { redirect 301 nowhere }
    route /d {
        header set host evil
        header set x-a
        header drop x-b value
        header set X-Upper v
        header set x-* v
        response header move x-c
        to 1.1.1.1:1
    }
    route /h { header set x-a "${nope}"; header set x-b "${time.us"; to 1.1.1.1:1 }
    route /e { rewrite path /a/{*} => /b; to 1.1.1.1:1 }
    route /f { rewrite path /a -> /b; to 1.1.1.1:1 }
    route /g { rewrite path /a/{*} -> /b?x=1; to 1.1.1.1:1 }
}
