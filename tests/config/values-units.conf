okena {
    watchdog 1.5s
    drain delay=250ms timeout=1.5us
    workers 0
}
pool p {
    server 1.1.1.1:1 weight=1001
    connect timeout=0.0001s rate=100/s warm=0 idle=5m
    health tcp every=30 fall=3
}
okena { workers 300 }
tcp :1 { to pool p }
pool hc4 { server 1.1.1.1:5; health http /x expect=200..99 }
pool hc5 { server 1.1.1.1:6; health http /x expect=99 }
