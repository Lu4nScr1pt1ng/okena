# PostgreSQL replicas behind one address
okena {
    workers auto
    io_engine io_uring
    drain delay=2s timeout=7s
}

tcp :5432 [::1]:5433 {
    to pool pg
    limits {
        connections 200000
    }
    timeout { idle 1h }
}

pool pg {
    server 10.0.0.11:5432 weight=2
    server db2.internal:5432
    server [2001:db8::1]:5432 backup
    server unix:/run/pg.sock
    balance least-conn
    connect { timeout 1s }
}

tcp 127.0.0.1:6379 { to 10.0.0.21:6379 10.0.0.22:6379 }
