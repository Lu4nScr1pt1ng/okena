# A reverse proxy for one application: two backends, health checked,
# balanced by least requests (the default).
#
#   okena -c examples/reverse-proxy.conf
#   curl http://localhost:8080/

pool app {
    server 127.0.0.1:3000
    server 127.0.0.1:3001
    health http GET /healthz every=2s
}

http :8080 {
    route /* { to pool app }
}
