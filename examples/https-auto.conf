# HTTPS with certificates from Let's Encrypt, obtained and renewed by okena.
# Plain HTTP on :80 is redirected to HTTPS. The names must point at this host.
#
#   okena -c examples/https-auto.conf

pool app {
    server 127.0.0.1:3000
}

http :443 {
    tls { auto }
    http2 on
    http3 on
    host example.com www.example.com {
        route /* { to pool app }
    }
}

http :80 {
    route /* { respond 404 }
}
