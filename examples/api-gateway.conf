# An API gateway: JWT from an identity provider's JWKS, a rate limit per user,
# CORS for a browser app, retries on another backend.
#
#   okena -c examples/api-gateway.conf

pool users {
    server 10.0.1.10:8080
    server 10.0.1.11:8080
}

http :8080 {
    host api.example.com {
        route /v1/* {
            auth jwt {
                jwks /etc/okena/jwks.json        # or an https:// URL, with trust=CA-FILE
                issuer https://login.example.com
                claims sub -> x-user-id
            }
            limit 100/s burst=200 key=jwt.sub headers=on
            cors origins=https://app.example.com
            retry 2
            to pool users
        }
    }
}
