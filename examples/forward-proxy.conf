# An egress proxy: clients use it as HTTPS_PROXY to reach the listed
# destinations only (CONNECT tunnels), with a username and password.
#
#   okena -c examples/forward-proxy.conf
#   curl -x http://user:pass@localhost:3128 https://api.github.com/

http :3128 {
    host api.github.com *.githubusercontent.com {
        route /* {
            tunnel
            auth basic users=/etc/okena/proxy.users
        }
    }
}
