# A static site (or a single-page app), straight from a directory, with an API
# beside it. Files go out with sendfile; precompressed .br/.gz are used when
# they exist.
#
#   okena -c examples/static-site.conf

pool api {
    server 127.0.0.1:4000
}

http :8080 {
    route /api/* { to pool api }
    route /*     { files /srv/www fallback=/index.html precompressed=br,gz }
}
