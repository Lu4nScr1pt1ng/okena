# Layer 4: a PostgreSQL primary and replica behind one address, health checked
# with a TCP connect, and a DNS service over UDP.
#
#   okena -c examples/tcp.conf

pool db {
    server 10.0.2.10:5432
    server 10.0.2.11:5432 backup
    health tcp every=1s
}

pool dns {
    server 10.0.3.10:53
    server 10.0.3.11:53
}

tcp :5432 { to pool db }
udp :53   { to pool dns; responses 1 }
