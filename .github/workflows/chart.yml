name: chart

# The Helm chart as an OCI artifact: oci://ghcr.io/<owner>/charts/okena, at the
# chart's version. On a release tag, or by hand for a tag already out.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: the tag whose chart to publish (v0.1.0)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: azure/setup-helm@v4
      - name: Lint, package, push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr A-Z a-z)
          helm lint contrib/helm/okena
          helm template t contrib/helm/okena > /dev/null
          helm package contrib/helm/okena -d build
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push build/okena-*.tgz "oci://ghcr.io/$owner/charts"
